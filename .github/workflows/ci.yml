name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: ["fmt:check", lint, check]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ${{ matrix.task }}
        run: bun run ${{ matrix.task }}

  tests:
    name: test:${{ matrix.runtime }}
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:9.0.7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 1s
          --health-retries 15
    env:
      VALKEY_TEST_URL: redis://127.0.0.1:6379/0
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node, deno]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1

      - name: Setup Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test on ${{ matrix.runtime }}
        run: bun run test:${{ matrix.runtime }}
