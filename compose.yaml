services:
  valkey:
    image: valkey/valkey:9.0.7-alpine
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 15
    stop_grace_period: 30s

  worker:
    build: .
    environment:
      VALKEY_URL: redis://valkey:6379/0
      QUEUE_NAME: ${QUEUE_NAME:-tg-scheduler-bootstrap}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
    depends_on:
      valkey:
        condition: service_healthy
    init: true
    stop_grace_period: 30s

volumes:
  valkey-data:
